async function logoCanvas(lw){
  const img=new Image();img.src=LOGO;await img.decode();
  const s=document.createElement("canvas");s.width=img.width;s.height=img.height;const sg=s.getContext("2d");sg.drawImage(img,0,0);
  const D=sg.getImageData(0,0,img.width,img.height).data;
  const ink=y=>{for(let x=0;x<img.width;x+=2){const i=(y*img.width+x)*4;if(D[i+3]>128&&D[i]*0.3+D[i+1]*0.59+D[i+2]*0.11<235)return true;}return false;};
  let y0=0;while(y0<img.height&&!ink(y0))y0++;
  let gap=0,y1=img.height,seen=false;
  for(let y=y0;y<img.height;y++){if(ink(y)){if(gap>img.height*0.04&&seen&&y>y0+img.height*0.3){y1=y-gap;break;}gap=0;seen=true;}else gap++;}
  const ch=y1-y0,lh=Math.round(ch*lw/img.width),t=document.createElement("canvas");t.width=lw;t.height=lh;
  const tg=t.getContext("2d");tg.drawImage(img,0,y0,img.width,ch,0,0,lw,lh);
  const id=tg.getImageData(0,0,lw,lh),a=id.data;
  for(let i=0;i<a.length;i+=4){const v=(a[i+3]>128&&a[i]*0.3+a[i+1]*0.59+a[i+2]*0.11<235)?0:255;a[i]=a[i+1]=a[i+2]=v;a[i+3]=255;}
  tg.putImageData(id,0,0);return t;
}
async function draw(txt){
  const lines=txt.split("\n"),fs=22,LH=28,top=28,c=document.getElementById("c");
  let logo=null;try{logo=await logoCanvas(105);}catch(e){}
  const lh=logo?logo.height:0,head=logo?top+lh+58:16;
  c.width=W;c.height=head+lines.length*LH+8;const g=c.getContext("2d");
  g.fillStyle="#fff";g.fillRect(0,0,W,c.height);g.fillStyle="#000";
  if(logo){g.drawImage(logo,(W-logo.width)/2,top);
    g.textAlign="center";g.textBaseline="top";
    g.font="bold 15px 'Courier New',monospace";g.fillText("Cocody Anono, Abidjan",W/2,top+lh+8);
    g.font="bold 13px 'Courier New',monospace";g.fillText("Tél : 07 09 71 16 50",W/2,top+lh+28);g.textAlign="left";}
  g.font="bold "+fs+"px 'Courier New',monospace";g.textBaseline="top";
  const cw=g.measureText("M").width,sc=Math.min(1,(W-8)/(cw*32));
  g.setTransform(sc,0,0,1,4,head);lines.forEach((l,i)=>g.fillText(l,0,i*LH));
  g.setTransform(1,0,0,1,0,0);
  return c;
}
function raster(c){
  const h=c.height,bw=W/8,d=c.getContext("2d").getImageData(0,0,W,h).data,out=[0x1b,0x40];
  for(let y0=0;y0<h;y0+=128){
    const bh=Math.min(128,h-y0);out.push(0x1d,0x76,0x30,0,bw,0,bh&255,bh>>8);
    for(let y=y0;y<y0+bh;y++)for(let bx=0;bx<bw;bx++){let v=0;
      for(let k=0;k<8;k++){const i=(y*W+bx*8+k)*4;if(d[i]*0.3+d[i+1]*0.59+d[i+2]*0.11<128)v|=128>>k;}out.push(v);}
  }
  out.push(0x1b,0x64,3);return out;
}
let INTENT="";
function go(){if(INTENT)location.href=INTENT;}
document.getElementById("go").onclick=go;
(async()=>{
  const c=await draw(readTxt());
  let bin="";raster(c).forEach(b=>bin+=String.fromCharCode(b));
  INTENT="intent:base64,"+btoa(bin)+"#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;";
  go();
})();
